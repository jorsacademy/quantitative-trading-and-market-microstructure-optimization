[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantitative-trading-market-microstructure-optimization"
version = "0.1.0"
description = "Optimization and stochastic-control examples for quantitative trading and market microstructure"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
where = [
  "src",
  "projects/optimal-trade-execution/src",
  "projects/market-making-inventory-control/src",
  "projects/smart-order-routing/src",
  "projects/limit-order-placement/src",
  "projects/rfq-pricing-dealer-optimization/src",
  "projects/limit-order-book-simulator/src",
  "projects/multi-venue-fragmented-market/src",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
